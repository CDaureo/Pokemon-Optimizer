<!doctype html>
<html lang="es">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Optimizador Pokemon Añil</title>
    <link rel="stylesheet" href="styles.css" />
  </head>
  <body>
    <main class="app">
      <section class="topbar">
        <div>
          <p class="eyebrow">Pokemon Añil Randomlocke</p>
          <h1>Optimizador de equipo</h1>
        </div>
        <div class="summary" id="summary"></div>
      </section>

      <section class="import-panel" aria-label="Cargar partida">
        <div>
          <strong>Partida cargada</strong>
          <span id="dataStatus">Datos de ejemplo</span>
        </div>
        <label class="file-button">
          <input id="saveFileInput" type="file" accept=".json,application/json" />
          <span>Cargar JSON de partida</span>
        </label>
        <button id="resetDataBtn" type="button" class="secondary-button">Volver a ejemplo</button>
      </section>

      <section class="controls" aria-label="Controles">
        <label class="search">
          <span>Buscar</span>
          <input id="searchInput" type="search" placeholder="Nombre, especie, habilidad, movimiento..." />
        </label>
        <label class="toggle">
          <input id="includeDead" type="checkbox" />
          <span>Incluir MUERTOS</span>
        </label>
        <label class="toggle">
          <input id="onlyAvailable" type="checkbox" checked />
          <span>Solo disponibles</span>
        </label>
        <label class="toggle">
          <input id="flatList" type="checkbox" />
          <span>Lista unica por valor</span>
        </label>
        <button id="optimizeBtn" type="button">Optimizar equipo</button>
      </section>

      <section class="layout">
        <aside class="panel recommendation">
          <div class="panel-head">
            <h2>Equipo recomendado</h2>
            <p id="teamScore"></p>
          </div>
          <div id="recommendedTeam" class="team"></div>
          <div id="teamNotes" class="notes"></div>
        </aside>

        <section class="panel roster-panel">
          <div class="panel-head">
            <h2>PC y equipo</h2>
            <p id="rosterCount"></p>
          </div>
          <div id="roster" class="roster"></div>
        </section>
      </section>
    </main>

    <div id="detailOverlay" class="detail-overlay" hidden>
      <section class="detail-panel" role="dialog" aria-modal="true" aria-labelledby="detailTitle">
        <div class="detail-head">
          <div id="detailTitle"></div>
          <button id="closeDetail" type="button" aria-label="Cerrar">Cerrar</button>
        </div>
        <div id="detailBody"></div>
      </section>
    </div>

    <script src="app-data.js"></script>
    <script src="app.js"></script>
  </body>
</html>
